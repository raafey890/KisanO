name: Frontend CD

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed
    branches:
      - main

defaults:
  run:
    working-directory: frontend

jobs:
  # ============================================================
  # JOB 1: Build & Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Build & Deploy Frontend → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: frontend-staging
      url: https://staging.kisano.in

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build for Staging
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
          VITE_APP_ENV: staging
          NODE_ENV: production

      # ---- Option A: Vercel Deployment (recommended) ----
      # Uncomment if deploying to Vercel:
      # - name: Deploy to Vercel (Staging)
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: ./frontend

      # ---- Option B: NGINX VPS Deployment ----
      - name: Deploy to Staging VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            mkdir -p /var/www/kisano-frontend

      - name: Upload Frontend Build to Staging Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          source: "frontend/dist/*"
          target: "/var/www/kisano-frontend"
          strip_components: 2

  # ============================================================
  # JOB 2: Deploy to Production (manual approval gate)
  # ============================================================
  deploy-production:
    name: Deploy Frontend → Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-staging
    environment:
      name: frontend-production
      url: https://kisano.in

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build for Production
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_APP_ENV: production
          NODE_ENV: production

      - name: Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            # Backup current deployment before replacing
            if [ -d /var/www/kisano-frontend ]; then
              cp -r /var/www/kisano-frontend /var/www/kisano-frontend.backup
            fi
            mkdir -p /var/www/kisano-frontend

      - name: Upload Frontend Build to Production Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          source: "frontend/dist/*"
          target: "/var/www/kisano-frontend"
          strip_components: 2

      - name: Reload NGINX to Serve New Build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker exec kisano-nginx-1 nginx -s reload
            echo "[✓] NGINX reloaded. Production frontend updated."

      - name: Verify Frontend Availability
        run: |
          sleep 5
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://kisano.in)
          if [ "$STATUS" -ne 200 ]; then
            echo "[ERROR] Frontend returned HTTP $STATUS. Possible deployment issue."
            exit 1
          fi
          echo "[✓] Frontend is live at https://kisano.in (HTTP $STATUS)"
