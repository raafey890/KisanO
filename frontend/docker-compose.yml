version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: kisano-frontend:latest
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
