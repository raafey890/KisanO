# =============================================================================
# KisanO — render.yaml (Render.com Platform Configuration)
# =============================================================================
# HOW TO USE:
#   1. Connect your repository to Render.
#   2. The blueprint will deploy the 'kisano-backend' Web Service.
#   3. You must set MONGODB_URI in the Render Dashboard Environment tab.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Backend API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: kisano-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: singapore          # Closest to India
    plan: free                 # Uses the free tier
    branch: main
    numInstances: 1            # Free tier supports 1 instance
    healthCheckPath: /health   # Render uses this to verify deployment success
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: WORKER_MODE
        value: embedded        # Run background tasks inside the web process for Free plan
      - key: APP_NAME
        value: "KisanO Backend"
      
      # Database Configuration
      - key: MONGODB_URI
        sync: false            # Must be set manually in Render Dashboard
      - key: DATABASE_NAME
        value: kisano_production
      
      # Security (Auto-generated by Render)
      - key: SECRET_KEY
        generateValue: true

      # Settings
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ENABLE_METRICS
        value: "true"
      
      # Embedded Worker config
      - key: BACKGROUND_WORKERS_COUNT
        value: "3"
      - key: MAX_JOB_RETRIES
        value: "3"
      - key: RETRY_DELAY_SECONDS
        value: "5"
      - key: CLEANUP_INTERVAL_HOURS
        value: "24"
      - key: ANALYTICS_REFRESH_HOURS
        value: "6"
      - key: SESSION_EXPIRY_DAYS
        value: "30"
      - key: WEBHOOK_LOG_RETENTION_DAYS
        value: "90"
    # Auto-deploy on push to main
    autoDeploy: true

  # ---------------------------------------------------------------------------
