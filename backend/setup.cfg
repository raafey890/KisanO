[flake8]
max-line-length = 120
exclude =
    venv,
    .venv,
    __pycache__,
    .git,
    generate_routers.py,
    fix_empty_routers.py,
    refactor_routers.py,
    restore_routers.py,
    testing_engine.py,
    scripts/,
    tests/performance/,
    tests/factories/,
    tests/fixtures/

per-file-ignores =
    # Tests: relax style rules
    tests/*:E302,E305,E306,E501,W291,W293,F401,E712
    # Auto-generated module stubs: whitespace and blank-line noise
    modules/*/router.py:W291,W293,E302,E305,F401
    modules/*/repository.py:W291,W293,E302,E305,F401
    modules/*/service.py:W291,W293,E302,E305,F401
    modules/*/constants.py:W291,W293,E302,E305,F401
    modules/*/schemas.py:W291,W293,E302,E305,F401
    modules/*/models.py:W291,W293,E302,E305,F401
    # Shared utilities
    shared/*:W291,W293,E302,E305,F401,E701

# Only flag genuine code quality errors in production code
extend-select =
    F811,
    F841
