# =============================================================================
# KisanO — Monitoring Stack Docker Compose
# Services: Prometheus, Grafana, Node Exporter, MongoDB Exporter, Redis Exporter
# Usage: docker compose -f docker-compose.monitoring.yml up -d
# Access: Grafana → http://localhost:3000 (admin/admin on first login)
# =============================================================================
version: '3.9'

networks:
  monitoring-network:
    name: kisano_monitoring
    driver: bridge
  backend-network:
    external: true
    name: kisano_backend

volumes:
  prometheus_data:
    name: kisano_prometheus_data
  grafana_data:
    name: kisano_grafana_data

services:
  # ---------------------------------------------------------------------------
  # Prometheus — Metrics collection and time-series database
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: kisano-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Grafana — Dashboards and visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: kisano-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme_in_production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://monitoring.kisano.in"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Pre-configure Prometheus as default data source
      GF_DATASOURCES_DEFAULT_NAME: Prometheus
      GF_DATASOURCES_DEFAULT_TYPE: prometheus
      GF_DATASOURCES_DEFAULT_URL: http://prometheus:9090
      GF_DATASOURCES_DEFAULT_IS_DEFAULT: "true"
    ports:
      - "3000:3000"
    networks:
      - monitoring-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Node Exporter — System/host metrics (CPU, memory, disk, network)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: kisano-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ---------------------------------------------------------------------------
  # MongoDB Exporter — MongoDB metrics for Prometheus
  # ---------------------------------------------------------------------------
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: kisano-mongodb-exporter
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URL:-mongodb://mongodb:27017}
    command:
      - '--collect-all'
      - '--compatible-mode'
    ports:
      - "9216:9216"
    networks:
      - monitoring-network
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ---------------------------------------------------------------------------
  # Redis Exporter — Redis metrics for Prometheus
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    container_name: kisano-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "9121:9121"
    networks:
      - monitoring-network
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
