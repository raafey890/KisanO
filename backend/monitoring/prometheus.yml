# =============================================================================
# KisanO — Prometheus Configuration (Enhanced)
# Scrapes: FastAPI backend, MongoDB, Redis, NGINX, node exporter
# =============================================================================

global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate alerting rules
  scrape_timeout: 10s

  # Labels to attach to all time series scraped by this instance
  external_labels:
    environment: "production"
    app: "kisano-backend"
    region: "ap-south-1"

# ---------------------------------------------------------------------------
# Alertmanager configuration (configure when adding Grafana alerts)
# ---------------------------------------------------------------------------
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ---------------------------------------------------------------------------
# Rule files for alerting
# ---------------------------------------------------------------------------
# rule_files:
#   - /etc/prometheus/rules/*.yml

# ---------------------------------------------------------------------------
# Scrape configurations
# ---------------------------------------------------------------------------
scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 60s

  # --- FastAPI Backend (prometheus-fastapi-instrumentator) ---
  - job_name: "kisano_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "backend"

  # --- Background Worker ---
  - job_name: "kisano_worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:8001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "worker"

  # --- MongoDB Exporter (mongodb_exporter) ---
  # Install: docker run -d --name mongodb-exporter percona/mongodb_exporter
  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "mongodb"

  # --- Redis Exporter (oliver006/redis_exporter) ---
  # Install: docker run -d --name redis-exporter oliver006/redis_exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  # --- NGINX Exporter (nginx-prometheus-exporter) ---
  # Requires nginx stub_status module
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "nginx"

  # --- Node / System Metrics (node_exporter) ---
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "vps-host"
