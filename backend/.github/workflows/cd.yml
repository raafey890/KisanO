name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Docker Build & Package"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    # Only run if Docker build was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    
    steps:
      - name: Deploy to Staging Environment
        run: |
          echo "[+] Triggering Staging Webhook or SSH script"
          # Mock hook. Replace with actual deployment logic (e.g., helm upgrade, terraform apply, ssh)
          echo "Deployed Git SHA ${{ github.sha }} to Staging."

      - name: Run Smoke Tests on Staging
        run: |
          echo "[+] Hitting staging /health endpoint to verify deployment"
          # curl -f https://staging.kisano.com/health || exit 1
          echo "Smoke tests passed."

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Uses GitHub Environment Protection Rules (Requires Manual Approval defined in Settings > Environments)
    environment: production
    
    steps:
      - name: Deploy to Production Environment
        run: |
          echo "[+] Manual Approval granted. Triggering Production Deployment."
          # Mock hook. 
          echo "Deployed Git SHA ${{ github.sha }} to Production."

      - name: Notify Success
        if: success()
        run: |
          echo "[+] Triggering Slack/Teams success webhook"

      - name: Trigger Automatic Rollback
        if: failure()
        run: |
          echo "[-] Deployment Failed. Triggering Rollback webhook."
