# =============================================================================
# KisanO — docker-compose.staging.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# Purpose: Staging overrides — single replica, relaxed limits, debug logging
# =============================================================================
version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      WORKER_MODE: embedded           # Embedded workers for staging simplicity
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "kisano-staging-backend"

  # ---------------------------------------------------------------------------
  # Background Worker
  # ---------------------------------------------------------------------------
  worker:
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
        tag: "kisano-staging-worker"

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------
  scheduler:
    restart: unless-stopped
    environment:
      ENVIRONMENT: staging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        tag: "kisano-staging-scheduler"

  # ---------------------------------------------------------------------------
  # NGINX — Staging reverse proxy (HTTP only, no Certbot)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend-network
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
