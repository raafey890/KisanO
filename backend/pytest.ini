[pytest]
# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Paths
testpaths = tests

# Coverage
addopts = 
    --strict-markers 
    --tb=short
    -v

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, hits multiple modules)
    api: API tests (hits endpoints)
    security: Security/RBAC tests
    performance: Performance hooks
    chaos: Chaos engineering hooks
    e2e: End-to-end flows
