# =============================================================================
# KisanO — NGINX Enterprise Configuration
# Features: HTTP/2, HTTPS, HSTS, CSP, Referrer Policy, Permissions Policy,
#           XSS Protection, static caching, rate limiting, gzip, WebSocket
# =============================================================================

# Tune worker processes to match CPU cores
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ---------------------------------------------------------------------------
    # MIME Types & Basics
    # ---------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide NGINX version from error pages and headers
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Connection Performance
    # ---------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # ---------------------------------------------------------------------------
    # Buffer Tuning
    # ---------------------------------------------------------------------------
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # ---------------------------------------------------------------------------
    # Gzip Compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------------
    # Logging — Structured JSON format (Loki/ELK compatible)
    # ---------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"host":"$host",'
            '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------------------------
    # Rate Limiting Zones
    # ---------------------------------------------------------------------------
    # Standard API rate limit: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Auth endpoints: tighter limit to prevent brute force
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # Webhook endpoints
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # ---------------------------------------------------------------------------
    # Upstream — Backend FastAPI
    # ---------------------------------------------------------------------------
    upstream backend_servers {
        least_conn;
        server backend:8000 fail_timeout=10s max_fails=3;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # SSL Defaults (applied to all SSL server blocks)
    # ---------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---------------------------------------------------------------------------
    # Proxy Defaults
    # ---------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 16k;

    # ---------------------------------------------------------------------------
    # SERVER BLOCK 1: HTTP — Redirect all to HTTPS + ACME Challenge
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.kisano.in kisano.in www.kisano.in admin.kisano.in;

        # ACME challenge for Let's Encrypt (Certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other HTTP to HTTPS (301 permanent)
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # ---------------------------------------------------------------------------
    # SERVER BLOCK 1.5: Frontend Subdomains (Static NGINX / VPS hosted)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name kisano.in www.kisano.in admin.kisano.in;

        ssl_certificate     /etc/letsencrypt/live/kisano.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kisano.in/privkey.pem;

        # Redirect www to non-www
        if ($host = www.kisano.in) {
            return 301 https://kisano.in$request_uri;
        }

        location / {
            # In a VPS setup, proxy to the frontend container
            # proxy_pass http://frontend_servers;
            # Or serve static files:
            # root /usr/share/nginx/html;
            # try_files $uri $uri/ /index.html;
            
            # Temporary 503 until frontend is deployed to this NGINX
            return 503;
        }
    }

    # ---------------------------------------------------------------------------
    # SERVER BLOCK 2: HTTPS — Main production server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.kisano.in;

        # SSL certificates (managed by Certbot)
        ssl_certificate     /etc/letsencrypt/live/api.kisano.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.kisano.in/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/api.kisano.in/chain.pem;

        # -----------------------------------------------------------------------
        # Enterprise Security Headers
        # -----------------------------------------------------------------------

        # HSTS: Force HTTPS for 1 year, include subdomains, allow preload
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # XSS Protection (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer Policy — don't leak full URL to third parties
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions Policy — disable unnecessary browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

        # Content Security Policy — strict API server (no JS served here)
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;

        # Don't cache sensitive responses unless explicitly instructed
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # -----------------------------------------------------------------------
        # Static Assets — Cache aggressively
        # -----------------------------------------------------------------------
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            gzip_static on;
        }

        # -----------------------------------------------------------------------
        # Health Check — No rate limit, no auth
        # -----------------------------------------------------------------------
        location = /health {
            proxy_pass http://backend_servers;
            proxy_read_timeout 5s;
            access_log off;
        }

        # -----------------------------------------------------------------------
        # Metrics — Internal only (restrict to internal network)
        # -----------------------------------------------------------------------
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend_servers;
        }

        # -----------------------------------------------------------------------
        # Auth Endpoints — Tighter rate limiting
        # -----------------------------------------------------------------------
        location ~ ^/api/v[0-9]+/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_conn conn_limit_per_ip 20;
            proxy_pass http://backend_servers;
        }

        # -----------------------------------------------------------------------
        # Webhook Endpoints — Higher rate limit for payment gateways
        # -----------------------------------------------------------------------
        location ~ ^/api/v[0-9]+/webhooks/ {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://backend_servers;
        }

        # -----------------------------------------------------------------------
        # WebSocket Support (for real-time features if added later)
        # -----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # -----------------------------------------------------------------------
        # Main API — Standard rate limiting
        # -----------------------------------------------------------------------
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit_per_ip 50;
            proxy_pass http://backend_servers;
        }

        # -----------------------------------------------------------------------
        # Security: Deny access to hidden files
        # -----------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # -----------------------------------------------------------------------
        # Security: Deny access to common exploit paths
        # -----------------------------------------------------------------------
        location ~* \.(git|svn|env|bak|sql|config)$ {
            deny all;
        }
    }
}
